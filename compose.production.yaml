services:
  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=you@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pollingapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  polling-api:
    image: ghcr.io/zweitstimme-org/pollingapi:latest
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pollingapi
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.polling-api.rule=Host(`api.fasttrack29.com`)"
      - "traefik.http.routers.polling-api.entrypoints=websecure"
      - "traefik.http.routers.polling-api.tls.certresolver=myresolver"
      - "traefik.http.services.polling-api.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3
    restart: always

  watchtower:
    image: containrrr/watchtower
    command:
      - "--label-enable"
      - "--interval"
      - "30"
      - "--rolling-restart"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/paul/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_CONFIG=/
    restart: always

volumes:
  pgdata:
