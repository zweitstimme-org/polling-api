site_name: Zweitstimme Polling API
site_url: https://api.fasttrack29.com
site_author: Zweitstimme
site_description: German election polling data API documentation

repo_name: zweitstimme/pollingapi
repo_url: https://github.com/zweitstimme/pollingapi

copyright: Copyright &copy; 2026 Zweitstimme

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: setup.md
    - Deployment: deployment.md
  - Understanding the Data:
    - Data Pipeline: pipeline.md
    - Database Schema: schema.md
  - API Usage:
    - API Reference: api.md
    - R Tutorial: r-vignette.md
