[sum]
tolerance = 2.0

[jump]
threshold = 4.0

[respondents]
default = [500, 6000]
TELEFONISCH = [700, 4000]
ONLINE = [500, 6000]
TELEFON_ONLINE = [700, 4000]
PERSOENLICH = [500, 3000]
UNBEKANNT = [500, 6000]

[core_parties]
green_from_year = 1990
afd_from_year = 2014
fdp_until_year = 2021

[reporting]
min_valid_share = 0.90
max_warning_share = 0.10
max_invalid_share = 0.05

[public_dataset]
require_persisted_validation = true
include_valid = true
include_warnings = true
exclude_failed_checks = []

[public_dataset.selection]
cutoff_year = 2005
pre_cutoff_provider = "Kayser/Rehmert"
post_cutoff_provider = "wahlrecht.de"
secondary_provider = "DAWUM"
include_unmatched_secondary_after_cutoff = true
exclude_ambiguous_secondary = true

[poll_matching]
date_window_days = 7
primary_provider = "wahlrecht.de"
secondary_provider = "DAWUM"
result_parties = ["SPD", "AFD"]
max_party_delta = 1.0
max_total_delta = 1.5
survey_date_tolerance_days = 0
respondent_tolerance = 0
min_score_gap = 0.01
