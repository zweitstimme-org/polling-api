name: API Feedback
description: Provide feedback, report issues, or suggest improvements for the Polling API
title: "[Feedback]: <title>"
labels: ["feedback"]
assignees: []
type: enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to provide feedback on the Polling API.
        Please complete the sections below as precisely as possible.

  - type: dropdown
    id: feedback_type
    attributes:
      label: Type of feedback
      description: What best describes your submission?
      options:
        - Bug report
        - Feature request
        - Documentation improvement
        - Data issue
        - Performance issue
        - General feedback
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Affected endpoint (if applicable)
      description: "Example: GET /v1/polls/latest"
      placeholder: "GET /v1/..."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: API version
      description: Which version of the API are you using?
      placeholder: "v1"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the issue, suggestion, or feedback.
      placeholder: Provide a detailed explanation.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior (if reporting a problem)
      description: What did you expect to happen?
      placeholder: Describe expected behavior.
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior (if reporting a problem)
      description: What actually happened?
      placeholder: Include error messages or unexpected responses.
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (if applicable)
      description: Provide steps or code snippets to reproduce the issue.
      placeholder: |
        1. Send request to ...
        2. Receive response ...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context, links, or screenshots that might help.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have checked the documentation and existing issues before submitting this feedback.
          required: true
