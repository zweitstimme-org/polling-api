name: Ruff

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    name: Ruff lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check .

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check .
