name: CI/CD Pipeline
'on':
  push:
    branches:
      - main
env:
  UV_SYSTEM_PYTHON: 1
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.22
          enable-cache: true
      - name: Install project
        run: uv sync --locked --all-extras --dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/pollingapi:latest
            ghcr.io/${{ github.repository_owner }}/pollingapi:${{ github.sha }}
  
      - name: ntfy (simple)
        if: always()
        run: |
          curl -fsS \
            -H "Title: CI: ${{ job.status }}" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-raw "Repo: ${{ github.repository }} | Ref: ${{ github.ref }} | SHA: ${{ github.sha }}" \
            "${{ secrets.NTFY_SECRET }}"
