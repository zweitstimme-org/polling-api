name: CI/CD Pipeline

on:
  push:
    branches:
      - production   # Trigger only when pushing to production

env:
  UV_SYSTEM_PYTHON: 1   # install deps directly into system python for CI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------
      # Checkout repository
      # ------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------
      # Install Python + uv
      # ------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version" # respects your pinned Python

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"   # pin uv version
          enable-cache: true  # persist uv cache

      - name: Install project
        run: uv sync --locked --all-extras --dev

      # ------------------------
      # Set up Docker + GHCR login
      # ------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------
      # Build & push Docker image
      # ------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/polling-api:latest
            ghcr.io/${{ github.repository_owner }}/polling-api:${{ github.sha }}
