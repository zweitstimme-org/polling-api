services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pollingapi_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    command:
      - "/app/.venv/bin/fastapi"
      - "run"
      - "app/main.py"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pollingapi_dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  db-init:
    build: .
    command:
      - "/app/.venv/bin/python"
      - "scripts/init_db.py"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pollingapi_dev
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
